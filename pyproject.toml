[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-os-experiment"
version = "0.1.0"
description = "Model-independent, reconstructible personal memory experiment"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=12,<13",
    "pymediainfo>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.57,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
